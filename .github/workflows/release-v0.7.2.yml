name: Release v0.7.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.7.2.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate and build distributions
        run: |
          python tools/build_portable.py
          python tools/validate_package.py
          python -m unittest discover -s tests
          python tools/build_release.py

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          TITLE="奕思 Geek&Chalk｜Blackboard Design Skill ${TAG}"
          cat > /tmp/release-notes.md <<'EOF'
          ## Blackboard Design Skill v0.7.2

          面向中国大陆小学、初中和高中教师的黑板报整图生成 Skill，由 **奕思 Geek&Chalk** 维护。

          ### 本版重点

          - 标准 Agent Skill 采用渐进加载结构，完整保留学段育人、柔性图像语法、生成修改协议与中文文案规则；
          - 提供面向普通教师的 Portable 单文件，无需理解 GitHub 目录结构；
          - 提供标准 ZIP，适用于 Codex、Claude Code、TRAE、WorkBuddy / CodeBuddy 等支持目录式 Skill 的环境；
          - 支持小学、初中、高中，以及传统黑板、卡纸剪贴和软板展板；
          - 默认交付 A 推荐主案、B 风格强化案和 C 简化实操案；
          - 增加奕思 Geek&Chalk 品牌、MIT License、隐私与开源社区文档；
          - 标准 ZIP 与 Portable 单文件均通过 Agent Skills 官方格式验证。

          ### 下载建议

          - 普通教师：下载 `blackboard-design-skill-portable-v0.7.2.md`；
          - Agent / 技术用户：下载 `blackboard-design-skill-v0.7.2.zip`；
          - 普通网页图片模式：使用 `WEB-QUICK-PROMPT.md`。

          不同平台最终画质取决于实际规划模型、图片模型与工具权限。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/blackboard-design-skill-v${VERSION}.zip" \
              "dist/blackboard-design-skill-portable-v${VERSION}.md" \
              "dist/WEB-QUICK-PROMPT.md" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/blackboard-design-skill-v${VERSION}.zip" \
              "dist/blackboard-design-skill-portable-v${VERSION}.md" \
              "dist/WEB-QUICK-PROMPT.md" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md
          fi
