name: Make repository public

on:
  push:
    branches:
      - main
    paths:
      - ".github/make-public.trigger"

permissions: write-all

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Change repository visibility to public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f visibility=public
