name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Confirm versioned single-file distribution is tracked
        run: git ls-files --error-unmatch "dist/blackboard-design-skill-v$(cat VERSION).md" >/dev/null

      - name: Confirm committed single-file distribution is current
        run: python tools/build_portable.py --check

      - name: Run repository validator
        run: python tools/validate_package.py

      - name: Run release contract tests
        run: python -m unittest discover -s tests

      - name: Build standard release archive and checksums
        run: |
          python tools/build_release.py
          python tools/build_checksums.py

      - name: Check out Agent Skills reference validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .agent-skills-reference

      - name: Install Agent Skills reference validator
        run: python -m pip install -e .agent-skills-reference/skills-ref

      - name: Validate standard release with skills-ref
        run: |
          mkdir -p .release-check
          python -m zipfile -e "dist/blackboard-design-skill-v$(cat VERSION).zip" .release-check
          skills-ref validate .release-check/blackboard-design-skill

      - name: Validate complete single-file Skill with skills-ref
        run: |
          mkdir -p .single-file-check/blackboard-design-skill
          cp "dist/blackboard-design-skill-v$(cat VERSION).md" \
             .single-file-check/blackboard-design-skill/SKILL.md
          skills-ref validate .single-file-check/blackboard-design-skill
