name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate tracked source and release contract
        run: |
          git ls-files --error-unmatch "dist/blackboard-design-skill-v$(cat VERSION).md" >/dev/null
          python tools/build_portable.py --check
          python tools/validate_package.py
          python -m unittest discover -s tests

      - name: Build release assets and notes
        run: |
          python tools/build_release.py
          python tools/build_checksums.py
          python tools/build_release_notes.py

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          TITLE="奕思 Geek&Chalk｜Blackboard Design Skill ${TAG}"
          ASSETS=(
            "dist/blackboard-design-skill-v${VERSION}.md"
            "dist/blackboard-design-skill-v${VERSION}.zip"
            "dist/WEB-QUICK-PROMPT.md"
            "dist/SHA256SUMS.txt"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "${TITLE}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
