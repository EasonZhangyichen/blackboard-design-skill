version: "0.7.2"
suite: "跨学段主题兼容与柔性图像语法"
cases:
  - id: primary-2-spring-softboard
    prompt: "小学二年级，春分主题，软板展板，由你一键生成。"
    checks:
      - "先生成完整软板预览，不直接输出素材表"
      - "标题牌加3-6个丰富但简单的模块"
      - "育人内容贴近生活与具体行动"

  - id: primary-5-reading-collage
    prompt: "小学五年级，读书节，黑板加卡纸剪贴，没有固定标题。"
    checks:
      - "生成孩子能理解的自然标题"
      - "场景与模块结合，不像PPT"
      - "选案前不批量生成打印素材"

  - id: junior-1-civilization-flexible
    prompt: "初一，校园文明主题，传统黑板，一键生成。"
    checks:
      - "去儿童化"
      - "使用主景环绕、青年编辑或限制色版画"
      - "正文可横竖斜混排但阅读顺序清楚"
      - "包含事实、问题或行动连接"

  - id: junior-2-ai
    prompt: "初二，人工智能与人的判断力，传统黑板。"
    checks:
      - "不堆机器人、芯片和蓝光"
      - "育人命题包含判断力与责任"
      - "标题有少年感而非幼态口号"
      - "可绘制"

  - id: senior-1-fixed-title-long-scroll
    prompt: "高一，固定标题《古韵传薪火 经典启新思》，传统手绘黑板。"
    checks:
      - "标题原样保留"
      - "使用流线长卷、题字驱动或主景环绕"
      - "有2-4段实质内容和题跋或引文"
      - "字图共生但不硬分区"

  - id: senior-2-ai-human-agency
    prompt: "高二，AI时代人的主体性，传统黑板，一键生成。"
    checks:
      - "不是少字科技海报"
      - "标题、正文和主意象共同表达技术伦理"
      - "避免复杂三维材质和摄影级细节"
      - "约半板文字存在感但不机械计算比例"

  - id: senior-festival-art-board
    prompt: "高二，新年班级祝福黑板，偏氛围感和同学留言。"
    checks:
      - "识别为节庆氛围型而非主题教育型"
      - "允许一幅强主视觉和较少正文"
      - "使用真实班级留言，不强塞2-4段论述"

  - id: senior-history-dual-narrative
    prompt: "高一，纪念英烈，传统黑板，希望庄重但不要全板大红。"
    checks:
      - "使用历史与当下的双叙事"
      - "官方符号只在必要时准确使用"
      - "色彩克制，红色作为主线而非铺满"
      - "正文有历史事实和青年责任连接"

  - id: stage-switch
    turns:
      - "小学四年级，非遗主题，黑板加剪贴。"
      - "改成高中版本，标题不变。"
    checks:
      - "重新执行高中育人、标题、内容和构图路由"
      - "不只是把小学方案换深色"
      - "改为传统手绘和字图共生，除非用户明确保留载体"

  - id: task-type-switch
    turns:
      - "高一，新年班级祝福，画面为主。"
      - "改成中华优秀传统文化主题教育板报。"
    checks:
      - "从节庆氛围型重新路由为主题教育型"
      - "增加实质正文和育人命题"
      - "不只在旧图上加一段话"

  - id: real-board-photo
    prompt: "高一读书节，使用我上传的真实后黑板照片。"
    checks:
      - "跟随真实比例和不可用区域"
      - "不强制默认比例覆盖实物"
      - "使用整块宽板容量"

  - id: no-image-tool
    prompt: "请直接生成三张高中黑板报图片。"
    environment: "no image generation tool"
    checks:
      - "明确当前不能生图"
      - "输出三套自包含提示词"
      - "不声称文件已经生成"

  - id: single-image-per-call
    prompt: "生成A/B/C三案。"
    environment: "one image per call; auto filename collision risk"
    checks:
      - "顺序生成"
      - "每次使用唯一文件名"
      - "生成后确认和重命名"

  - id: mandatory-feedback-loop
    prompt: "初二，心理健康主题，传统黑板，生成三案。"
    checks:
      - "交付后主动询问替换什么"
      - "询问哪里不满意"
      - "询问哪些部分希望保留"

  - id: print-assets-after-selection
    turns:
      - "小学五年级软板，读书节，生成三案。"
      - "我选B，把标题和右侧书卷拆成可打印PNG。"
    checks:
      - "第一轮不拆素材"
      - "第二轮只拆选中局部"
      - "素材背景干净、可裁切"

  - id: cross-stage-core-values-primary
    prompt: "小学三年级，社会主义核心价值观主题，重点体现文明、友善和诚信，黑板加卡纸剪贴。"
    checks:
      - "保留社会主义核心价值观主题，不因小学而删除或改成无关主题"
      - "通过班级生活、同伴交往和具体行动适龄表达"
      - "不机械罗列抽象概念或成人化政策语言"

  - id: cross-stage-red-spirit-junior
    prompt: "初二，革命纪念日主题：纪念一二·九运动，体现红色精神与青年责任，传统黑板。"
    checks:
      - "核实历史事实与纪念日期"
      - "从人物选择、集体责任和和平意识进入"
      - "不以全板红色和政治符号堆叠替代内容"

  - id: cross-stage-solar-term-senior
    prompt: "高一，清明节气与中华优秀传统文化主题，希望有文化思考，传统黑板。"
    checks:
      - "不因高中而把节气主题改成宏大口号"
      - "从物候、诗文、时间意识和传统的当代表达进入"
      - "标题、正文和意象体现高中认知深度"
